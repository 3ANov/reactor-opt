[project]
name = "reactor-opt"
version = "0.1.0"
description = "Учебное приложение для оптимизации химико-технологических процессов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "argon2-cffi>=25.1.0",
    "numpy>=2.0",
    "pyqtgraph>=0.13.7",
    "pyvista>=0.49.1",
    "pyvistaqt>=0.13.1",
    "sqlalchemy>=2.1.5",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
